version: "3"
chore_min_version: 0.6.0

# THE CONTRACT THIS FILE EXISTS TO OWN.
#
# How to build rust-fs-ntfs is knowledge that belongs to rust-fs-ntfs. It used
# to live in a consumer's build scripts — four of them, 757 lines between
# them, byte-identical once you normalise the driver name, of which three
# lines per script were actually about the filesystem: the cargo invocation,
# the header name and the archive name.
#
# `staticlib` is the whole interface a consumer needs, AND IT TAKES NO
# OUTPUT DIRECTORY. It builds into this crate's own dist/; `chore artifact`
# prints the absolute path of that DIRECTORY, and a consumer copies its
# contents. Nothing outside this repo should know the target triple, the
# cargo profile, or where cargo puts things — and nothing outside it
# chooses where the output lands.
#
# `artifact` PRINTS A DIRECTORY, NOT A FILE. That is the one place this
# differs from rust-blk-probe, whose single binary lets its `artifact` name
# a file: this crate produces libfs_ntfs.a AND the headers beside it, so
# there is no single path to name.
vars:
  TRIPLE: aarch64-apple-darwin
  LIBNAME: fs_ntfs

  # THE SIBLING PINS. One declaration each, and the only one.
  #
  # These used to live in three places at once: .gitmodules held the
  # commit, the CI workflows re-stated it in a `git clone --branch`, and
  # the README told a human a third version of the same thing. Three
  # copies of one fact is three chances to disagree, and they did.
  #
  # FS_CORE_REF MUST MATCH Cargo.lock, AND MATCH WHAT THE OTHER CRATES
  # EXPECT — two constraints, and the second one is the one that is easy
  # to forget. THE RATIONALE IS DELIBERATELY VERSION-NEUTRAL: it named
  # specific versions twice and was wrong twice, because the pin has now
  # held three different values and a comment that argues from numbers
  # needs editing every time one of them moves.
  #
  # The sibling at ../rust-fs-core is ONE checkout shared by every crate
  # in the family (ext4, btrfs, xfs, erofs, squashfs, qcow2, vhd,
  # partitions and this one). Checking it out at a version that suits
  # this crate alone would build the others against a library older or
  # newer than their own locks claim.
  #
  # So bumping this is NOT a local decision: it means converging with the
  # family, and the bump lands here and in their pins together. That is
  # the cost of one shared copy, and it is the same property that makes
  # drift impossible rather than merely detectable.
  FS_CORE_REF: v0.2.13

  # The Windows-VM test harness. Not a cargo dependency — a tool this
  # repo's scripts invoke — so nothing but this pin governs which
  # version runs the matrix.
  HARNESS_REF: v4.1.0

  # THE WINDOWS TEST VM is driven by scripts/vm.sh (vmrun, trove for the
  # encryption password, the fixed host-only address). See that file and
  # docs/vm-setup.md in fs-windows-test-harness.

# .test-env is this machine's VM config: VM_HOST, SSH_KEY, VM_WORKDIR,
# HOST_IMAGE_DIR, and VM_VMX for the vm:* tasks. Gitignored and per machine;
# the harness's run-tests.sh writes the first four on its first run.
#
# THE `?` MAKES ITS ABSENCE NORMAL. chore treats a missing dotenv file as an
# error, which is right for a file that decides which stack a command acts on
# -- but this one only configures the VM, and CI has no VM. Without the `?`
# every CI job died at its first chore call with `siblings: no environment
# loaded`, before a test ran. A machine with no VM config runs everything
# that does not need one.
dotenv: ['?.test-env']

tasks:
  staticlib:
    desc: Build the static library and its headers into this crate's dist/
    # NO `out` ARGUMENT, deliberately. A library does not write into its
    # consumer. It builds into its own dist/ and a consumer asks where that
    # is — `chore artifact` prints the path. Inverting it that way means this
    # crate can change its output layout without every consumer knowing, and
    # it stays independently usable with no consumer at all.
    vars:
      OUT: 'dist'

    # Freshness, replacing the 101 lines of stamp-file and mtime comparison
    # the old scripts carried. Content checksums, so touching a file does not
    # trigger a rebuild and reverting one does not hide behind a newer mtime.
    #
    # These patterns are LITERAL on purpose. chore records a fingerprint by
    # calling fingerprint.Save WITHOUT a renderer (internal/run/run.go:313),
    # so a pattern containing {{ }} is expanded against the raw text, matches
    # nothing, and stores the empty-set hash — the task then never registers
    # as up to date. Measured 2026-08-27 against chore 0.6.0.
    sources:
      - Cargo.toml
      - 'src/**/*.rs'
      - 'include/*.h'
      # fs_core.h is a source of ours because we ship it (see the cp below).
      # THIS PATH AND THE cp MUST AGREE, and nothing checks that they do —
      # it is the same path Cargo.toml resolves am-fs-core from.
      - '../rust-fs-core/include/fs_core.h'

    # Templated, which is fine here where it is not fine above: the check
    # renders these correctly, and every entry is an exact path rather than a
    # glob, so a missing artifact is caught by the pattern failing to match.
    generates:
      - '{{.OUT}}/lib{{.LIBNAME}}.a'
      - '{{.OUT}}/include/{{.LIBNAME}}.h'

    cmds:
      # Idempotent, and it replaces a 25-line "is the target installed" dance:
      # rustup answers "up to date" without touching the network when it is.
      # It runs here rather than in the consumer because the triple is ours.
      - 'rustup target add {{.TRIPLE}}'
      - 'cargo build --release --target {{.TRIPLE}}'
      - 'mkdir -p "{{.OUT}}/include"'
      - 'cp target/{{.TRIPLE}}/release/lib{{.LIBNAME}}.a "{{.OUT}}/lib{{.LIBNAME}}.a"'
      - 'cp include/{{.LIBNAME}}.h "{{.OUT}}/include/{{.LIBNAME}}.h"'
      # Shipping fs_core.h is ours: the header we emit #includes it, so a
      # consumer handed only fs_ntfs.h cannot compile.
      - 'cp "../rust-fs-core/include/fs_core.h" "{{.OUT}}/include/fs_core.h"'

  siblings:
    desc: Check out the sibling repos this crate builds against, at their pinned tags
    # WHY THIS EXISTS, AND WHY IT IS NOT `git submodule update`.
    #
    # This crate needs two other repos for coordinated development:
    # rust-fs-core supplies the canonical budget wrapper and generated header,
    # while fs-windows-test-harness is a tool the matrix scripts invoke.
    # Both were git submodules under vendor/, and submodules
    # turned out to be the wrong shape for a constellation of crates
    # that depend on each other.
    #
    # The reason is that a submodule pins a copy PER CONSUMER. Measured
    # across this workspace, rust-fs-core existed as FIVE checkouts at
    # FOUR different versions — v0.2.3-3, v0.2.2 twice, v0.2.1 and
    # v0.1.0-3 — and nothing reported the divergence, because each repo
    # was internally consistent with its own pin. One of them had even
    # drifted from its own lockfile.
    #
    # A sibling checkout has one copy on disk, so that class of drift is
    # not merely detected, it is unrepresentable. The cost is real and
    # worth stating: every repo on this machine shares that one copy, so
    # they must agree on the version at any given moment. For a family
    # that releases together, agreeing is the point. For a repo that
    # genuinely needs an older line, a submodule is still the better
    # tool — which is why the dormant win-driver repos keep theirs.
    #
    # IT REFUSES TO TOUCH A DIRTY SIBLING. A checkout is destructive to
    # uncommitted work, and a task that runs in CI must not be a task
    # that eats a colleague's afternoon when they run it locally. It
    # reports and fails instead; the human decides.
    cmds:
      - |
        set -eu
        # name<TAB>url<TAB>ref
        printf '%s\t%s\t%s\n' \
          rust-fs-core            https://github.com/antimatter-studios/rust-fs-core.git            '{{.FS_CORE_REF}}' \
          fs-windows-test-harness https://github.com/antimatter-studios/fs-windows-test-harness.git '{{.HARNESS_REF}}' \
        | while IFS="$(printf '\t')" read -r name url ref; do
            dir="../$name"

            if [ ! -d "$dir/.git" ]; then
              echo "siblings: cloning $name at $ref"
              git clone --quiet --branch "$ref" "$url" "$dir"
              continue
            fi

            # Uncommitted work in the sibling: say so and stop. Anything
            # else here silently discards someone's changes.
            if [ -n "$(git -C "$dir" status --porcelain)" ]; then
              echo "siblings: $name has uncommitted changes — refusing to move it." >&2
              echo "          Commit or stash them in $dir, then re-run." >&2
              exit 1
            fi

            # Already there? Say nothing. This task runs before every
            # build, and a line of output per sibling per invocation is
            # noise that trains people to stop reading it.
            if [ "$(git -C "$dir" rev-parse HEAD)" = "$(git -C "$dir" rev-parse "$ref^{commit}" 2>/dev/null || echo x)" ]; then
              continue
            fi

            echo "siblings: moving $name to $ref"
            git -C "$dir" fetch --quiet --tags origin
            git -C "$dir" checkout --quiet "$ref"
          done

  siblings:check:
    desc: Report whether the siblings are at their pinned tags, changing nothing
    # The read-only half, for CI and for answering "why does this build
    # differ from mine". `siblings` moves things; this one never does,
    # so it is safe to run against a working tree you care about.
    silent: true
    cmds:
      - |
        set -eu
        # The `while` below runs in a subshell (right-hand side of a
        # pipe), so a variable set inside it does not survive. A file
        # does.
        flag="$(mktemp)"
        printf '%s\t%s\n' \
          rust-fs-core            '{{.FS_CORE_REF}}' \
          fs-windows-test-harness '{{.HARNESS_REF}}' \
        | while IFS="$(printf '\t')" read -r name ref; do
            dir="../$name"
            if [ ! -d "$dir/.git" ]; then
              printf '  %-23s MISSING (want %s)\n' "$name" "$ref"
              echo drift >> "$flag"
              continue
            fi
            have="$(git -C "$dir" describe --tags --always 2>/dev/null || echo '?')"
            dirty=""
            [ -n "$(git -C "$dir" status --porcelain)" ] && dirty=" [dirty]"
            if [ "$(git -C "$dir" rev-parse HEAD)" = "$(git -C "$dir" rev-parse "$ref^{commit}" 2>/dev/null || echo x)" ]; then
              printf '  %-23s ok   %s%s\n' "$name" "$have" "$dirty"
            else
              printf '  %-23s DRIFT have=%s want=%s%s\n' "$name" "$have" "$ref" "$dirty"
              echo drift >> "$flag"
            fi
          done

        # Non-zero on drift, so this is a GATE and not merely a report.
        # `build` and `test` depend on it: a crate compiled against a
        # sibling checkout nobody pinned is a build nobody can
        # reproduce, and compile time is when you want to hear about it.
        if [ -s "$flag" ]; then
          rm -f "$flag"
          echo "siblings: run 'chore siblings' to move them to their pinned tags." >&2
          exit 1
        fi
        rm -f "$flag"

  siblings:gate:
    desc: siblings:check, silent unless a sibling has drifted
    # What the test tiers depend on. siblings:check is a REPORT -- it prints
    # a line per sibling whether or not anything is wrong, which is right
    # when you asked for it and two lines of noise in front of every tier
    # when you did not. This runs the same check and shows its report only
    # when it fails, so the gate is the same gate and a green tier stays one
    # line.
    silent: true
    cmds:
      - |
        if ! out="$("{{.CHORE_EXE}}" siblings:check 2>&1)"; then
          printf '%s\n' "$out" >&2
          exit 1
        fi
  build:cli:
    desc: Build the rust-ntfs CLI the matrix drives (target/release/rust-ntfs) -- skipped when up to date
    # UP TO DATE MEANS THE SOURCES HAVE NOT CHANGED, by content: chore hashes
    # these files and skips the task while the hashes match and the binary
    # exists. cargo would also notice nothing changed, but only after
    # starting up, resolving the workspace and checking every crate --
    # measured at about a second and a screen of output per run; this is
    # neither. Patterns are LITERAL for the reason given on staticlib.
    #
    # The core sibling is included because the generated header and the
    # coordinated output-budget source are part of the family workflow.
    # rust-toolchain.toml because a toolchain bump changes the output.
    sources:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - 'src/**/*.rs'
      - '../rust-fs-core/Cargo.toml'
      - '../rust-fs-core/src/**/*.rs'
    generates:
      - target/release/rust-ntfs
    # THE GATE, not the report: siblings:check prints a line per sibling
    # whether or not anything drifted, and `chore matrix` would wear those
    # two lines in front of every run. Same check, silent when it passes.
    deps: [siblings:gate]
    cmds:
      - cargo build --release --locked --bin rust-ntfs --quiet

  matrix:
    desc: 'Run matrix scenarios on the Windows VM: `chore matrix -- <group|filter>` (e.g. smoke, mac-format-tiny-32mib)'
    # Everything a scenario needs, declared rather than remembered: the CLI
    # it formats with (rebuilt only if its sources changed) and a running VM
    # whose address is in .test-env. Missing either used to fail every
    # scenario at step 1 -- five retries each of `rust-ntfs: No such file`.
    deps: [build:cli, vm:up]
    # Sweep the VM's disk images twice, and the FIRST sweep is the one that
    # matters: a run that dies (the VM stopped responding on 2026-09-18)
    # never reaches its own cleanup, and its 30 GiB of leftovers are what
    # makes the NEXT run fail to ship a 4 GiB image. `after` runs on failure
    # as well as success, so the normal path leaves nothing either.
    after: [bash scripts/vm-clean-images.sh]
    cmds:
      # After the run, pass or fail: bring the VM's per-scenario evidence
      # (chkdsk's report, what Windows enumerated) home and say what it shows.
      - defer: scripts/matrix-fetch-diag.sh
      - bash scripts/vm-clean-images.sh
      # THROUGH tier.sh, like every other tier: the scenarios' own output is
      # 1,500 lines of per-step progress that nobody reads when the run is
      # green, and an agent re-reads on every later step. What is left is one
      # verdict line, the diagnostics summary for the scenarios that need a
      # look, and the whole run in tmp/logs/matrix.log. `-- --verbose`
      # streams it as it happens -- worth it for a run this long when you are
      # watching one.
      #
      # The filter is forwarded, so `chore matrix -- smoke --verbose` works:
      # tier.sh takes --verbose out of CLI_ARGS and run-matrix.sh never sees
      # it.
      - |
        set -eu
        # The runner shells out to ssh and scp, so it needs the agent that
        # holds the VM's key -- see scripts/vm-ssh-agent.sh for what happens
        # when it inherits a shell's empty one instead.
        SSH_AUTH_SOCK="$(scripts/vm-ssh-agent.sh)"; export SSH_AUTH_SOCK
        filter=""
        for arg in {{.CLI_ARGS}}; do
          case "$arg" in --verbose|-v) continue ;; esac
          filter="$filter $arg"
        done
        # shellcheck disable=SC2086  # the words are the point
        scripts/tier.sh matrix -- bash scripts/run-matrix.sh $filter

  # THE VM TASKS. The Windows VM is a thing a task depends on, not a thing a
  # person remembers to start: a matrix task declares `deps: [vm:up]`, and
  # vm:up is idempotent. The work is in scripts/vm.sh; each task is one line
  # so a failure prints the script's one-line reason, not a screen of shell.
  # Opening the encrypted VM needs trove unlocked in the calling shell.
  matrix:check:
    desc: Lint test-matrix.json against fs-windows-test-harness.toml (no VM needed)
    silent: true
    cmds: [python3 scripts/fs-windows-test-harness/check-matrix]

  vm:clean:
    desc: Delete the disk images a matrix run left on the VM, and say how much space that gave back
    silent: true
    timeout: 5m
    cmds: [bash scripts/vm-clean-images.sh]

  vm:status:
    desc: Is the Windows test VM running, and does it answer SSH at VM_HOST? One line.
    silent: true
    cmds: [scripts/vm.sh status]

  vm:up:
    desc: Start the VM headless if needed, discover its address, write VM_HOST to .test-env, wait for SSH
    silent: true
    timeout: 15m
    cmds: [scripts/vm.sh up]

  vm:address:
    desc: Discover the running VM's address (prefers its fixed host-only one) and print user@ip
    silent: true
    timeout: 10m
    cmds: [scripts/vm.sh address]

  vm:network:
    desc: Give the VM its fixed address (VM_STATIC_IP) inside Windows, or say what is missing
    silent: true
    timeout: 15m
    cmds: [scripts/vm.sh network]

  vm:down:
    desc: Shut the Windows test VM down cleanly (a no-op if it is not running)
    silent: true
    timeout: 5m
    cmds: [scripts/vm.sh down]

  lint:
    desc: Formatting and clippy, exactly as CI runs them
    # `--locked` is not decoration. It makes the build fail rather than
    # silently update Cargo.lock, which is what keeps a local gate and
    # CI checking the same dependency versions — and it is what the
    # release process relies on.
    #
    # This exists so the CI gate can be reproduced locally. If the two
    # ever differ, this is the copy that is wrong.
    #
    # fmt prints nothing when it passes and the diff when it does not,
    # which is already the right shape. clippy prints a line per crate it
    # checks, so it runs as a quiet tier: a verdict line, the log in
    # tmp/logs/, and the tail on failure. `chore lint -- --verbose` streams it.
    #
    # agents-core-check is here rather than in a test tier because a stale
    # agent guide is a lint problem: the file is still valid, it just no
    # longer says what the rest of the family says. It prints one line.
    cmds:
      - cargo fmt --check
      - scripts/agents-core-check.sh
      - scripts/tier.sh clippy -- cargo clippy --locked --all-targets -- -D warnings

  build:
    desc: Debug build
    # cargo already BUILDS the sibling — it is a path dep. What cargo
    # cannot know is whether that checkout is the one this crate
    # intends, which is what the gate answers.
    deps: [siblings:gate]
    cmds: ['cargo build']

  # THE TEST TIERS. Each is one `cargo test` selection from ci.yml, run
  # through scripts/tier.sh: QUIET BY DEFAULT. A pass prints one line --
  # the tier, its size, and the log in tmp/logs/ that holds the whole run.
  # A failure prints the log's tail. A pass that printed more than the
  # tier's measured budget fails with status 65. `-- --verbose` (or
  # OUTPUT_BUDGET_VERBOSE=1) streams the run as well; it is still budgeted.
  #
  # The commands are ci.yml's, word for word, and ci.yml runs them through
  # the same script, so a tier that goes over budget goes over it in both
  # places. The executed-test floors stay in ci.yml, where they gate.
  test:unit:
    desc: 'Unit tests (src/), release -- ci.yml "unit tests (release)"'
    deps: [siblings:gate]
    cmds:
      - scripts/tier.sh unit -- cargo test --release --locked --lib

  test:unit:debug:
    desc: 'Unit tests (src/), debug, overflow checks armed -- ci.yml "unit tests (debug, ...)"'
    deps: [siblings:gate]
    # EXPECT_OVERFLOW_CHECKS makes overflow_checks in src/lib.rs prove this
    # build traps an overflow. See the long comment on the ci.yml step.
    env:
      EXPECT_OVERFLOW_CHECKS: '1'
    cmds:
      - scripts/tier.sh unit-debug -- cargo test --locked --lib

  test:mkfs:
    desc: 'The two fixture-free integration files -- ci.yml "fixture-free integration tests"'
    deps: [siblings:gate]
    cmds:
      - scripts/tier.sh mkfs -- cargo test --release --locked --test mkfs_roundtrip --test mkfs_bin_smoke

  test:suite:
    desc: 'Every unit and integration test, release -- ci.yml "full suite"'
    deps: [siblings:gate]
    # The fixtures are checked first: without them the fixture-driven files
    # panic one test at a time, 4,755 lines of the same missing file.
    cmds:
      - test-disks/check-fixtures.sh
      - scripts/tier.sh suite -- cargo test --release --locked --no-fail-fast

  test:
    desc: 'Every test tier CI runs, quietly: unit, unit (debug), mkfs, the whole suite'
    # `-- --verbose` reaches every tier: CLI_ARGS is chore's, not the task's.
    cmds:
      - task: test:unit
      - task: test:unit:debug
      - task: test:mkfs
      - task: test:suite
      # THE LAST LINE: one number across the tiers, and where the detail is.
      - scripts/test-verdict.sh unit unit-debug mkfs suite

  test:ignored:
    desc: 'The #[ignore]d tests: known defects, run so a fix cannot go unnoticed'
    # AN IGNORED TEST NOBODY RUNS IS A DELETED TEST WITH EXTRA STEPS.
    # Two tests sat ignored over a link-count defect that had already
    # been fixed (#149); nothing told anyone, because no workflow ran
    # `--ignored`. This does, and REPORTS rather than gates: the ones
    # left are known-bad by construction, so a red here would be a red
    # on every run and would stop meaning anything. A PASS is the signal
    # -- it means a defect is fixed and its test should lose the
    # attribute.
    silent: true
    deps: [siblings:gate]
    cmds:
      - |
        set -u
        out=$(cargo test --release --locked -- --ignored 2>&1)
        printf '%s\n' "$out" | grep -E '^test .* \.\.\. (ok|FAILED)' || true
        passed=$(printf '%s\n' "$out" | grep -cE '^test .* \.\.\. ok' || true)
        if [ "${passed:-0}" -gt 0 ]; then
            echo "test:ignored: $passed ignored test(s) PASSED -- the defect each documents is fixed; drop its #[ignore]" >&2
        else
            echo "test:ignored: every ignored test still fails, which is what 'known defect' means"
        fi

  test:scripts:
    desc: The shell tests (tests/scripts/*.sh), every one by glob
    # By glob, so a test added later needs no edit here -- a test that has to
    # be registered somewhere else is a test that gets silently skipped.
    cmds:
      # Through tier.sh, so a failure prints the tail of the log instead of
      # telling the reader to go and run it again themselves.
      - scripts/tier.sh scripts -- bash -c 'for t in tests/scripts/*.sh; do bash "$t"; done'

  clean:
    desc: Remove this crate's cargo output
    cmds: ['cargo clean']

  artifact:
    desc: Print the absolute path of the directory holding the built outputs
    # `silent: true` is what makes this usable as a VALUE — without it chore
    # echoes each command and a caller capturing stdout gets the echo too.
    # PATTERNS.md: "a value — a flag string, a container status, a path" is a
    # task called through {{.CHORE_EXE}}.
    silent: true
    # NO `deps: [staticlib]`. chore prints "task: staticlib is up to date" on
    # STDOUT, which a caller capturing this as a value receives as PART OF THE
    # VALUE — measured on rust-blk-probe, where the capture came back as two
    # lines and the caller's path check failed. A value-returning task returns
    # a value and does nothing else; the caller builds first, then asks. Two
    # calls, on purpose.
    #
    # IT PRINTS A DIRECTORY, NOT A FILE, and that is the one place this differs
    # from rust-blk-probe's `artifact`. That crate produces a single binary, so
    # it can name a file. This one produces libfs_ntfs.a AND the headers beside
    # it, so there is no single path to name — A CONSUMER COPIES THE CONTENTS of
    # what this prints. A consumer that treats it as a file path will silently
    # copy the wrong thing.
    cmds:
      - 'cd "{{.OUT}}" && pwd -P'
    vars:
      OUT: 'dist'
