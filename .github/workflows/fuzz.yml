name: fuzz

# The explorer half of the fuzzing setup. The gate half --
# tests/fuzz_decoders.rs -- runs in the ordinary test job on every pull
# request, because it is deterministic and finishes in a few seconds.
# This one is neither, and that is why it is here instead.
#
# A fuzzer's result depends on how long it ran. Putting it in the pull
# request gate would mean a fresh finding fails whichever unrelated
# change happened to be open, and a green result would only ever mean
# "nothing found in the seconds we could spare".
#
# THIS WORKFLOW IS WHY THE TARGETS EXIST. Three of them were added on
# 2026-05-03 and no workflow ran them; fuzz/Cargo.toml also named the
# dependency `fs-ntfs` where the package is `am-fs-ntfs`, so they had
# never compiled either, and fuzz/.gitignore ignored the corpus they
# would have needed. A harness nothing runs is indistinguishable from
# one that runs and finds nothing.
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per target"
        required: false
        default: "120"
  schedule:
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fuzz:
    name: fuzz the boot sector, records, index and codec
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The siblings come through `chore`, at the refs pinned in
      # chores.yml, the same way ci.yml gets them -- rather than a second
      # place naming which rust-fs-core this repository builds against.
      # Linux only here, so none of ci.yml's Windows fallback is needed.
      - name: chore siblings
        run: |
          curl -fsSL https://github.com/antimatter-studios/chore/releases/download/v0.11.0/chore-linux-amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin chore
          chore siblings

      # Nightly, not the pin in rust-toolchain.toml. cargo-fuzz needs
      # `-Z sanitizer`, which stable does not have. The explicit
      # `+nightly` in scripts/fuzz-all.sh overrides the pin for these
      # invocations and nothing else.
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      # Building cargo-fuzz takes several minutes and changes about as
      # often as the compiler does, so it is cached on its own version
      # rather than on this repository's lockfile.
      - name: Cache cargo-fuzz
        id: cache-cargo-fuzz
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Install cargo-fuzz
        if: steps.cache-cargo-fuzz.outputs.cache-hit != 'true'
        run: cargo +nightly install cargo-fuzz --locked

      - name: Show what the corpus holds
        run: |
          find fuzz/corpus -type f | sort
          echo "total: $(find fuzz/corpus -type f | wc -l) seeds"

      - name: Fuzz
        run: ./scripts/fuzz-all.sh "${{ inputs.seconds || '120' }}"

      # WITHOUT THIS THE FINDING IS LOST. A crash reproducer lives in
      # fuzz/artifacts/<target>/ on the runner, and the runner is thrown
      # away. The log would say a target crashed and the bytes that
      # caused it would be gone, leaving the next person to re-derive an
      # input the fuzzer had already found.
      - name: Keep the reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 90
