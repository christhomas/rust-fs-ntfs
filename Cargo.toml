[package]
name = "am-fs-ntfs"
version = "0.7.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Pure-Rust NTFS filesystem driver. Exposes a C ABI (fs_ntfs_*) suitable for FFI from C/C++/Go/etc."
repository = "https://github.com/christhomas/rust-fs-ntfs"
readme = "README.md"

# The fuzz crate is its own package, on its own toolchain, and is not
# part of this one. Without this, `cargo package` and `cargo publish`
# try to include it and fail on the nightly-only dependency.
#
# The captured volumes in test-disks/ are the integration tests' oracle,
# already gzipped, so the .crate cannot compress them: with the wrapped-log
# captures they made it 7.2 MB, against 3.3 MB for 0.7.0 and crates.io's
# 10 MB limit. Nothing a consumer builds reads them.
exclude = ["fuzz", "test-disks/*.gz", "test-disks/*.manifest"]

[lib]
name = "fs_ntfs"
crate-type = ["staticlib", "rlib"]

# Unified CLI — format / ls / touch / mkdir / write / rm / rmdir
# subcommands. Cross-platform: builds and runs identically on
# Linux/macOS/Windows because it only depends on this crate's own
# pure-Rust read/write paths. One binary so distribution (GitHub
# Releases, Homebrew taps) ships a single artefact.
#
# Embedding consumers (GUI apps, OS-integration shims) link the
# library directly via the C ABI in `include/fs_ntfs.h` rather than
# shelling out to this CLI; the `format` subcommand and the embedded
# `format_filesystem()` FFI entry point share the same implementation.
[[bin]]
name = "rust-ntfs"
path = "src/bin/rust_ntfs/main.rs"

# THE COMMAND-LINE TOOLS: one multi-call binary, named for the repository.
# It dispatches on argv[0], the way busybox and e2fsprogs do, so a release
# installs it once as `rust-fs-ntfs` and links `mkfs.ntfs` to it (cargo
# refuses a dot in a target name, so the dotted names are never cargo's).
# `rust-fs-ntfs <tool> ...` is the form nothing else on PATH can shadow, and
# `cargo run --features cli -- mkfs ...` works before anything is installed.
# The formatter was the `mkfs_ntfs` target; it is this binary's `mkfs` now.
#
# BEHIND THE `cli` FEATURE, so the static library a consumer links gains no
# dependency from the tools: `required-features` keeps the target out of a
# build that did not ask for it. The test tiers, clippy and the release ask
# for it, so the tests, the lints and the tarball all reach it.
[[bin]]
name = "rust-fs-ntfs"
path = "src/cli/main.rs"
required-features = ["cli"]

# WHAT THE RELEASE TARBALL SHIPS, read by rust-fs-core's package-cli
# (`scripts/core.sh package-cli`, run by core's release-cli workflow and by
# the pull-request `cli` job). Every dotted name the binary answers to, with
# its man section, and the licence files at the root. CAVEATS is the default,
# packaging/CAVEATS. Core checks the names against `rust-fs-ntfs generate
# names`, so a tool added to the binary and not here fails the package step.
[package.metadata.package-cli]
names = { "fs.ntfs" = 1, "fsck.ntfs" = 8, "mkfs.ntfs" = 8 }
licenses = ["LICENSE-APACHE", "LICENSE-MIT"]

[features]
# The command-line tools and nothing else. The plumbing they share --
# dispatch, --version, doctor, the output contract, man pages and
# completions -- is am-fs-core's `cli` feature, turned on only here, so
# the static library gains nothing. clap is MIT/Apache-2.0.
cli = ["dep:clap", "am-fs-core/cli"]

[dependencies]
# `log` is the de-facto standard logging facade. Consumers (FSKit
# extension, CLI, integration tests) install whichever subscriber
# they want — `log` itself is a no-op until one is set, so the crate
# stays quiet by default.
log = "0.4"
# The <errno.h> values the C ABI reports, taken from the platform the crate
# is built for rather than written down: ENOTEMPTY is 66 on macOS and 39 on
# Linux, and a hard-coded 66 was never ENOTEMPTY to a Linux caller (#382).
# MIT/Apache-2.0, already in the tree through the dependencies.
libc = "0.2"
# Block-device trait surface shared with sister crates (qcow2 reader,
# partition probe, the other fs-* drivers). Normal builds use the published
# crate, so a standalone clone does not require a sibling checkout.
# `chore siblings` still provides the coordinated core checkout for the
# family-level test tooling and generated headers.
#
# It was a git submodule under vendor/. A submodule pins a copy per
# consumer, so the family accumulated five checkouts of this one crate
# at four different versions with nothing reporting it. A sibling is one
# shared copy, which makes that drift unrepresentable rather than merely
# detectable.
#
# Strictly additive — ntfs's existing BlockIo trait is unchanged; this
# adds a bridge module so external `fs_core::BlockDevice` implementors
# (a `Qcow2Reader`, a `SliceReader`, etc.) can be driven by ntfs.
am-fs-core = { version = "0.2.18" }
# The command-line tools' argument parser, behind the `cli` feature (see
# the `rust-fs-ntfs` target above). No derive: the builder API keeps each
# tool's command a function the man pages and completions are made from.
clap = { version = "4.5", optional = true, default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }

[dev-dependencies]
# YAML parser for tests/ci_profile.rs, which reads .github/workflows/ci.yml
# and refuses if the debug run that lets the PR gate see an arithmetic
# overflow has been removed or disabled. It PARSES the file rather than
# scanning its text: quoted keys, block scalars, comments and nested
# mappings are the grammar, not edge cases, and a guard that misreads
# its input reports protection it is not providing. Pure Rust, YAML 1.2
# (so GitHub's `on:` key stays the string `on` and is not folded into a
# boolean), MIT/Apache-2.0, and no C to transpile -- unlike serde_yaml,
# which is deprecated and wraps unsafe-libyaml. Dev-only: it never
# reaches a consumer of this crate. Same version as the siblings, so the
# copies of this guard stay one answer rather than several.
saphyr = "0.0.12"
# Upstream read-only NTFS parser, kept ONLY as a test oracle: the native
# read/write/fsck layers cross-check their decoded values against it. No
# production code path links it anymore (Phase 6 demotion) — `#[cfg(test)]`
# modules in read.rs / write.rs / fsck.rs are the sole users.
ntfs = { version = "0.4", default-features = false, features = ["std"] }
libtest-mimic = "0.7"
# SHA-256 for tests/windows_interrupted_fixture.rs, which compares every
# file Windows recovered against the hashes Windows itself computed.
# MIT/Apache-2.0, pure Rust. Dev-only.
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }

# Criterion benchmarks for the three byte-decoders most likely to
# regress as the crate evolves. Run with `cargo bench`; not part of
# CI (criterion needs warm-up samples that don't fit in the per-PR
# budget).
[[bench]]
name = "byte_decoders"
harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "unwind"

[profile.dev]
opt-level = 1
panic = "unwind"
